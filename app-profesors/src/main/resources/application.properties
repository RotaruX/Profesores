# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/app_profesores?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: crea/actualiza las tablas automaticamente segun tus entidades @Entity
spring.jpa.hibernate.ddl-auto=update

# Muestra por consola las sentencias SQL que ejecuta Hibernate (util para aprender/depurar)
spring.jpa.show-sql=true

app.upload.dir.examenes=uploads/examenes