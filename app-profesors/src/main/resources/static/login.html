<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · App Profesores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">

    <!-- Panel izquierdo: identidad de marca -->
    <section class="brand-panel">
      <div class="brand-content">
        <span class="brand-eyebrow">App Profesores</span>
        <h1 class="brand-title">Tu material docente,<br>siempre a mano.</h1>
        <p class="brand-text">Guarda exámenes, rúbricas y preguntas. Mejora tu material curso tras curso.</p>
      </div>

      <!-- Elemento de firma: pila de "fichas" apiladas, como examenes archivados -->
      <div class="stack" aria-hidden="true">
        <div class="stack-card stack-card--3"></div>
        <div class="stack-card stack-card--2"></div>
        <div class="stack-card stack-card--1">
          <span class="stack-line"></span>
          <span class="stack-line stack-line--short"></span>
          <span class="stack-check">✓</span>
        </div>
      </div>
    </section>

    <!-- Panel derecho: formulario -->
    <section class="form-panel">
      <div class="card">
        <h2 class="card-title">Inicia sesión</h2>
        <p class="card-subtitle">Accede a tu biblioteca de materiales.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo" placeholder="tu.correo@centro.es" required>
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
          </div>

          <!-- Aqui mostraremos, desde login.js, los errores que devuelva el backend -->
          <p id="form-error" class="form-message form-message--error" hidden></p>

          <button type="submit" class="btn-primary">Iniciar sesión</button>
        </form>

        <p class="card-footer">
          ¿Todavía no tienes cuenta? <a href="register.html">Regístrate</a>
        </p>
      </div>
    </section>

  </div>

  <script src="js/login.js" defer></script>
</body>
</html>
