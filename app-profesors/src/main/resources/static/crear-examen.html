<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear examen · App Profesores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">

    <nav class="sidebar">
      <div class="sidebar-logo">App Profesores</div>

      <a href="dashboard.html" class="nav-item">Panel</a>
      <a href="examenes.html" class="nav-item nav-item--active">Exámenes</a>
      <a href="#" class="nav-item">Banco de preguntas</a>
      <a href="#" class="nav-item">Sugerencias</a>
      <a href="#" class="nav-item">Perfil</a>

      <button id="logout-btn" class="nav-item nav-item--logout">Cerrar sesión</button>
    </nav>

    <main class="main-content">
      <h1 class="dashboard-title">Crear examen</h1>
      <p id="curso-actual" class="dashboard-subtitle">Selecciona el curso para este examen.</p>

      <div class="field-row crear-examen-config">
        <div class="field">
          <label for="examen-curso">Curso</label>
          <select id="examen-curso"></select>
        </div>
        <div class="field">
          <label for="examen-fecha">Fecha (opcional)</label>
          <input type="date" id="examen-fecha">
        </div>
      </div>

      <h2 class="section-title">Selecciona preguntas de tu banco</h2>
      <div id="preguntas-grid" class="preguntas-grid"></div>
      <p id="preguntas-vacio" class="empty-state-text" hidden>Todavía no tienes preguntas guardadas. Crea una abajo.</p>

      <div class="nueva-pregunta">
        <label for="nueva-pregunta-texto">Añadir una pregunta nueva a tu banco</label>
        <textarea id="nueva-pregunta-texto" placeholder="Escribe el enunciado..."></textarea>
        <div class="field-row">
          <input type="text" id="nueva-pregunta-asignatura" placeholder="Asignatura">
          <select id="nueva-pregunta-dificultad">
            <option value="facil">Fácil</option>
            <option value="media" selected>Media</option>
            <option value="dificil">Difícil</option>
          </select>
        </div>
        <button id="btn-anadir-pregunta" class="btn-secondary" type="button">Añadir pregunta al banco</button>
      </div>

      <p id="form-error" class="form-message form-message--error" hidden></p>

      <div class="modal-actions">
        <a href="examenes.html" class="btn-secondary">Cancelar</a>
        <button id="btn-guardar-examen" class="btn-primary btn-inline" type="button">Guardar examen</button>
      </div>
    </main>
  </div>

  <script src="js/crear-examen.js" defer></script>
</body>
</html>
