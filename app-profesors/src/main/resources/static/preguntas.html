<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco de preguntas · App Profesores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">

    <nav class="sidebar">
      <div class="sidebar-logo">App Profesores</div>

      <a href="dashboard.html" class="nav-item">Panel</a>
      <a href="examenes.html" class="nav-item">Exámenes</a>
      <a href="preguntas.html" class="nav-item nav-item--active">Banco de preguntas</a>
      <a href="./sugerencias.html" class="nav-item">Sugerencias</a>
      <a href="#" class="nav-item">Perfil</a>

      <button id="logout-btn" class="nav-item nav-item--logout">Cerrar sesión</button>
    </nav>

    <main class="main-content">
      <h1 class="dashboard-title">Banco de preguntas</h1>
      <p class="dashboard-subtitle">Todas tus preguntas guardadas, listas para reutilizar.</p>

      <div class="nueva-pregunta nueva-pregunta--pagina">
        <label for="nueva-pregunta-texto">Añadir una pregunta nueva</label>
        <textarea id="nueva-pregunta-texto" placeholder="Escribe el enunciado..."></textarea>
        <div class="field-row">
          <input type="text" id="nueva-pregunta-asignatura" placeholder="Asignatura">
          <select id="nueva-pregunta-dificultad">
            <option value="facil">Fácil</option>
            <option value="media" selected>Media</option>
            <option value="dificil">Difícil</option>
          </select>
        </div>
        <button id="btn-anadir-pregunta" class="btn-primary btn-inline" type="button">Añadir pregunta</button>
      </div>

      <h2 class="section-title">Tus preguntas</h2>
      <div id="preguntas-grid" class="preguntas-grid"></div>
      <p id="preguntas-vacio" class="empty-state-text" hidden>Todavía no tienes ninguna pregunta guardada.</p>
    </main>
  </div>

  <script src="js/common.js" defer></script>
  <script src="js/preguntas.js" defer></script>
</body>
</html>
